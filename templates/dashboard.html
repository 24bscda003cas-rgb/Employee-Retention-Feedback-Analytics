{% extends "base.html" %}
{% block content %}
<h2>Employee Analytics Dashboard</h2>
<div class="row g-3 my-2">
<div class="col-md-4"><div class="card p-3"><h6>Total Employees</h6><h2>{{ total }}</h2></div></div>
<div class="col-md-4"><div class="card p-3"><h6>Attrition</h6><h2>{{ attrition }}</h2></div></div>
<div class="col-md-4"><div class="card p-3"><h6>Continue</h6><h2>{{ continue_count }}</h2></div></div>
</div>
<div class="card p-4 mt-3"><h5>Retention Overview</h5><canvas id="retentionChart"></canvas></div>
<script>
new Chart(document.getElementById("retentionChart"), {
type:"doughnut",
data:{labels:["Continue","Attrition"],datasets:[{data:[{{continue_count}},{{attrition}}]}]}
});
</script>
{% endblock %}
